<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Budget{% endblock %}</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e3e1da;
  --accent: #1f6f5c; --accent-ink: #ffffff; --good: #1f7a3f; --warn: #a15c00; --bad: #b3261e;
  --good-bg: #e6f3ea; --warn-bg: #fdf1dc; --bad-bg: #fbe7e5; --chip: #efeee9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --surface: #201f1d; --ink: #ecebe6; --muted: #a09e97; --line: #34332f;
    --accent: #5fbfa4; --accent-ink: #10201b; --good: #74c98f; --warn: #e3a54a; --bad: #ef8a80;
    --good-bg: #1d2e22; --warn-bg: #33281a; --bad-bg: #3a201e; --chip: #2b2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px 24px; min-height: 56px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; }
nav a.on, nav a:hover { color: var(--ink); background: var(--chip); }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 32px 0 12px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.acct { display: block; color: inherit; text-decoration: none; }
.acct:hover { border-color: var(--accent); }
.acct .name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.acct .name a { color: inherit; text-decoration: none; }
.acct .name a:hover { text-decoration: underline; }
.acct .name a.edit { font-weight: 400; font-size: 13px; color: var(--accent); }
.acct .bal { font-size: 22px; font-weight: 650; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: 13px; }
.net { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.net strong { font-size: 20px; font-variant-numeric: tabular-nums; }
.btn { display: inline-block; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600;
  background: var(--accent); color: var(--accent-ink); text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
a.plain { color: inherit; text-decoration: none; }
a.plain:hover { text-decoration: underline; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
label.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
.check input { width: auto; padding: 0; margin: 3px 0 0; flex: none; }
td.date { white-space: nowrap; }
.btn.small { padding: 4px 10px; font-size: 13px; font-weight: 500; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.neg { color: var(--ink); } td.pos { color: var(--good); }
.memo { color: var(--muted); font-size: 13px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip); color: var(--muted); white-space: nowrap; }
.tag.new { background: var(--good-bg); color: var(--good); }
.tag.probable { background: var(--warn-bg); color: var(--warn); }
.check { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; }
.check.ok { background: var(--good-bg); color: var(--good); }
.check.ko { background: var(--bad-bg); color: var(--bad); }
.alert { padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); margin-bottom: 12px; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
.stat { flex: 1 1 140px; } .stat b { display: block; font-size: 22px; }
form.stack { display: grid; gap: 14px; max-width: 460px; }
label { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
label span { font-weight: 400; color: var(--muted); font-size: 13px; }
input, select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.search { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.search input, .search select { flex: 1 1 180px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
@media (max-width: 640px) { .hide-sm { display: none; } nav { width: 100%; margin-left: -10px; } }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">Budget</div>
  <nav>
    <a href="/" class="{{ 'on' if request.url.path == '/' }}">Tableau de bord</a>
    <a href="/transactions" class="{{ 'on' if request.url.path.startswith('/transactions') }}">Transactions</a>
    <a href="/importer" class="{{ 'on' if request.url.path.startswith('/importer') }}">Importer</a>
    <a href="/regles" class="{{ 'on' if request.url.path.startswith('/regles') }}">Règles</a>
  </nav>
</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
