[project]
name = "budget"
version = "0.1.0"
description = "Gestion de budget personnelle, locale : import de relevés Desjardins (PDF, QIF, QFX), catégorisation et rapports."
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<0.12",
    "ofxtools>=0.9.5,<0.10",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34,<0.35",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20",
]

[project.scripts]
budget = "budget.web.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"budget.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
